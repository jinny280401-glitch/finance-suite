name: 看票分析
description: 输入股票代码或名称，获取深度分析报告
icon: M3 3v18h18M9 17V9m4 8V5m4 8v-4
color: from-blue-500 to-cyan-500
search_type: stock

# 数据维度：驱动 get_stock_full_data() 获取哪些维度
dimensions:
  - financials
  - realtime
  - price_history
  - fund_flow
  - news
  - dividends
  - valuation

# 缓存有效期（秒）
cache:
  ttl: 600

# QC 时效阈值（天）：超过则标记为 stale
qc:
  dimensions:
    financials: { stale_days: 90 }
    price_history: { stale_days: 3 }
    fund_flow: { stale_days: 3 }
    news: { stale_days: 7 }
    realtime: { stale_days: 1 }
