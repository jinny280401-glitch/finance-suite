<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图6 · 多端触达 — Vera Agent</title>
<link rel="stylesheet" href="deck.css">
<style>
  body{ padding:0; }
  .stage{
    width:100%; height:100vh;
    background: radial-gradient(ellipse at center, #131a2e 0%, #0a0e1a 70%);
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  /* 中心圆 */
  .hub{
    position:relative;
    width:300px; height:300px;
    border-radius:50%;
    background: linear-gradient(160deg, #1a2240 0%, #0d1426 100%);
    border:1px solid var(--stroke);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 0 0 18px rgba(78,168,255,.04),
      0 0 0 36px rgba(78,168,255,.025),
      0 30px 80px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    z-index:5;
  }
  .hub::before{
    content:""; position:absolute; inset:-60px;
    border-radius:50%; border:1px dashed rgba(78,168,255,.15);
    animation: rot 60s linear infinite;
  }
  .hub::after{
    content:""; position:absolute; inset:-110px;
    border-radius:50%; border:1px dashed rgba(155,107,255,.1);
    animation: rot 90s linear infinite reverse;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .hub .ico, .hub .logo-avatar{
    width:96px; height:96px; border-radius:50%;
    background: linear-gradient(135deg, rgba(78,168,255,.25), rgba(155,107,255,.25));
    border:2px solid rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(80,120,255,.40),
               0 0 0 4px rgba(255,255,255,.04);
  }
  .hub .logo-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hub .ico svg{ width:38px; height:38px; }
  .hub .name{
    font-size:24px; font-weight:800; color:var(--ink);
    letter-spacing:.5px; margin-bottom:2px;
  }
  .hub .role{
    font-size:11.5px; color:var(--cyan);
    text-transform:uppercase; letter-spacing:2px; margin-bottom:6px;
  }
  .hub .sub{
    font-size:12.5px; color:var(--sub);
    padding:0 18px; line-height:1.5;
  }

  /* 4 个角节点 */
  .node{
    position:absolute;
    width:240px;
    background: linear-gradient(160deg, #161d36 0%, #0f1528 100%);
    border:1px solid var(--stroke);
    border-radius:20px;
    padding:24px 20px 20px;
    text-align:center;
    z-index:4;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .node::before{
    content:""; position:absolute;
    top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.5;
  }
  .node .ico{
    width:56px; height:56px; border-radius:14px;
    background: rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center;
  }
  .node .ico svg{ width:32px; height:32px; }
  .node .label{
    font-size:16px; font-weight:700; color:var(--ink);
    margin-bottom:4px;
  }
  .node .hint{
    font-size:11.5px; color:var(--sub);
    line-height:1.5;
  }
  /* 4 角位置 */
  .n-tl{ top:6%;  left:6%;  }
  .n-tr{ top:6%;  right:6%; }
  .n-bl{ bottom:6%; left:6%;  }
  .n-br{ bottom:6%; right:6%; }

  /* 4 条虚线(中心 → 4 角) */
  .conn{
    position:absolute; inset:0;
    pointer-events:none; z-index:1;
  }

  /* 标题 */
  .title-bar{
    position:absolute; top:32px; left:48px;
    z-index:6;
  }
  .title-bar .num{
    font-size:13px; color:var(--cyan);
    font-weight:700; letter-spacing:3px; margin-bottom:6px;
  }
  .title-bar .name{
    font-size:28px; font-weight:800; color:var(--ink);
  }
  .title-bar .tag{
    font-size:13px; color:var(--sub);
    margin-top:6px; letter-spacing:1px;
  }

  /* 底部说明 */
  .legend{
    position:absolute; bottom:32px; left:50%;
    transform:translateX(-50%);
    z-index:6;
    background: var(--glass);
    border:1px solid var(--stroke);
    border-radius:999px;
    padding:12px 28px;
    display:flex; align-items:center; gap:10px;
    backdrop-filter: blur(10px);
  }
  .legend .dot{
    width:8px; height:8px; border-radius:50%;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    box-shadow:0 0 8px rgba(78,168,255,.6);
  }
  .legend span{
    font-size:13.5px; color:var(--ink);
  }

  @media (max-width:860px){
    .node{ width:160px; padding:16px 12px; }
    .hub{ width:200px; height:200px; }
    .hub .name{ font-size:18px; }
    .title-bar{ top:18px; left:24px; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="title-bar">
    <div class="num">FIG.06</div>
    <div class="name">多端触达</div>
    <div class="tag">用户在哪,她就在哪</div>
  </div>

  <!-- 4 条虚线(从中心向 4 角) -->
  <svg class="conn" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="rgba(78,168,255,.5)"/>
        <stop offset="1" stop-color="rgba(78,168,255,0)"/>
      </linearGradient>
      <linearGradient id="g2" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0" stop-color="rgba(55,230,216,.5)"/>
        <stop offset="1" stop-color="rgba(55,230,216,0)"/>
      </linearGradient>
      <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="rgba(155,107,255,.5)"/>
        <stop offset="1" stop-color="rgba(155,107,255,0)"/>
      </linearGradient>
      <linearGradient id="g4" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="rgba(255,107,193,.4)"/>
        <stop offset="1" stop-color="rgba(255,107,193,0)"/>
      </linearGradient>
    </defs>
    <!-- 左上 飞书(中心→左上) -->
    <line x1="50" y1="50" x2="14" y2="18" stroke="url(#g1)" stroke-width=".25" stroke-dasharray=".8 .8"/>
    <!-- 右上 企微 -->
    <line x1="50" y1="50" x2="86" y2="18" stroke="url(#g2)" stroke-width=".25" stroke-dasharray=".8 .8"/>
    <!-- 左下 Web -->
    <line x1="50" y1="50" x2="14" y2="82" stroke="url(#g3)" stroke-width=".25" stroke-dasharray=".8 .8"/>
    <!-- 右下 API/扩展 -->
    <line x1="50" y1="50" x2="86" y2="82" stroke="url(#g4)" stroke-width=".25" stroke-dasharray=".8 .8"/>
  </svg>

  <!-- 中心 Vera Agent -->
  <div class="hub">
    <div class="logo-avatar">
      <img src="assets/vera-portrait-closeup.png" alt="Vera" />
    </div>
    <div class="name">Vera Agent</div>
    <div class="role">ORCHESTRATION CORE</div>
    <div class="sub">真相汇聚的投研数字员工 · 底座 天玑</div>
  </div>

  <!-- 左上 飞书 -->
  <div class="node n-tl">
    <div class="ico">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="larkG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00D6B9"/>
            <stop offset="1" stop-color="#3370FF"/>
          </linearGradient>
        </defs>
        <path fill="url(#larkG)" d="M6 4h6l4 8-4 4-6-6V4zm14 0h6v6l-6 6-4-4 4-8zM4 14l8 4-4 4H4v-8zm24 0v8h-8l4-4 4-4zM6 22h6l4-8 4 8h6l-6 6H12l-6-6z"/>
      </svg>
    </div>
    <div class="label">飞书 Lark</div>
    <div class="hint">企业内部 / 群机器人</div>
  </div>

  <!-- 右上 企业微信 -->
  <div class="node n-tr">
    <div class="ico">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="wecomG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a8dff"/>
            <stop offset="1" stop-color="#1d5fdc"/>
          </linearGradient>
        </defs>
        <rect x="3" y="6" width="26" height="20" rx="4" fill="url(#wecomG)"/>
        <path fill="#fff" d="M10 14c0-2.2 1.8-4 4-4s4 1.8 4 4-1.8 4-4 4c-.5 0-1-.1-1.4-.3L9 19l1.2-2.5C9.4 15.6 10 14.8 10 14z"/>
        <circle cx="22" cy="13" r="1.2" fill="#fff"/>
      </svg>
    </div>
    <div class="label">企业微信</div>
    <div class="hint">客户群 / 通知</div>
  </div>

  <!-- 左下 Web -->
  <div class="node n-bl">
    <div class="ico">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="12" fill="none" stroke="#4ea8ff" stroke-width="2"/>
        <ellipse cx="16" cy="16" rx="5" ry="12" fill="none" stroke="#37e6d8" stroke-width="1.5"/>
        <line x1="4" y1="16" x2="28" y2="16" stroke="#9b6bff" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="2" fill="#4ea8ff"/>
      </svg>
    </div>
    <div class="label">Web 端</div>
    <div class="hint">touziagent.com</div>
  </div>

  <!-- 右下 微信(放右下,改成对称布局) -->
  <div class="node n-br">
    <div class="ico">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path fill="#1aad19" d="M11 6c-4.4 0-8 3-8 6.7 0 2 1.1 3.8 2.9 5.1L5 20l3-1.6c.9.3 1.9.5 3 .5h.6c-.2-.5-.3-1.1-.3-1.6 0-3.6 3.4-6.5 7.6-6.5.4 0 .8 0 1.2.1C19.4 8 15.6 6 11 6zm-3 4.5c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm6 0c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1z"/>
        <path fill="#1aad19" d="M27 18.8c0-3-3-5.4-6.6-5.4-3.8 0-6.8 2.4-6.8 5.4 0 3 3 5.4 6.8 5.4.8 0 1.5-.1 2.2-.3l2.4 1.3-.6-1.9c1.6-1 2.6-2.6 2.6-4.5zm-8.7-1.1c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9zm4.4 0c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z"/>
      </svg>
    </div>
    <div class="label">微信</div>
    <div class="hint">个人号 / 朋友圈</div>
  </div>

  <!-- 底部说明 -->
  <div class="legend">
    <span class="dot"></span>
    <span>4 触达入口同时在线 · 任一通道发起对话,Vera 实时响应</span>
  </div>
</div>
</body>
</html>
