<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>效果演示</title>
<link rel="stylesheet" href="deck.css">
<style>
  .center{flex:1;display:flex;align-items:center;justify-content:center;z-index:2}
  .center h1{font-size:clamp(64px,7vw,120px);font-weight:850;letter-spacing:6px;color:var(--ink)}
  .center h1 .accent{background:linear-gradient(110deg,var(--cyan),var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<div class="slide">
  <div class="center">
    <h1><span class="accent">效果演示</span></h1>
  </div>
</div>
</body>
</html>
