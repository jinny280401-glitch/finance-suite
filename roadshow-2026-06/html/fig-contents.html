<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录 · Vera Trusted AI Research Infrastructure</title>
<style>
  :root{
    --bg0:#070b16;--bg1:#111827;--ink:#f4f7ff;--sub:#9fb0d0;
    --cyan:#37e6d8;--blue:#4ea8ff;--violet:#9b6bff;--orange:#ffb056;
    --stroke:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;background:var(--bg0);color:var(--ink)}
  .slide{
    width:100vw;height:100vh;position:relative;overflow:hidden;display:grid;grid-template-columns:68% 32%;
    background:
      radial-gradient(760px 500px at 18% -8%,rgba(78,168,255,.15),transparent 62%),
      linear-gradient(145deg,var(--bg0),var(--bg1));
  }
  .slide::after{content:"";position:absolute;inset:18px;border:1px solid var(--stroke);border-radius:26px;pointer-events:none;z-index:10}

  /* ===== LEFT: Content ===== */
  .content{padding:46px 72px 38px 76px;display:flex;flex-direction:column;min-width:0;position:relative;z-index:2}

  .heading{display:grid;grid-template-columns:auto 1fr;align-items:end;column-gap:22px}
  h1{font-size:50px;line-height:1;font-weight:850;letter-spacing:0}
  .en{font-size:15px;color:var(--cyan);font-weight:800;letter-spacing:5px;padding-bottom:4px}
  .subtitle{margin-top:14px;font-size:15px;color:var(--sub);font-weight:600;letter-spacing:1px}
  .rule{height:1px;background:linear-gradient(90deg,rgba(55,230,216,.65),rgba(78,168,255,.25),transparent);margin-top:18px}

  .chapters{margin-top:18px;display:flex;flex-direction:column;flex:1;min-height:0;gap:0}
  .chapter{--accent:var(--cyan);display:grid;grid-template-columns:96px 1fr;align-items:center;flex:1;min-height:0;border-bottom:1px solid rgba(255,255,255,.09);position:relative;padding:8px 0}
  .chapter:last-child{border-bottom:0}
  .chapter::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:2px;box-shadow:0 0 14px var(--accent)}
  .num{padding-left:19px;font-size:46px;line-height:1;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;font-family:"SF Mono","JetBrains Mono","PingFang SC",monospace}
  .ch-info{display:flex;flex-direction:column;gap:5px}
  .chapter-title{font-size:23px;font-weight:750;line-height:1.3;color:#fff;letter-spacing:.3px}
  .chapter-detail{font-size:14.5px;line-height:1.5;color:var(--sub);font-weight:550}

  /* ===== RIGHT: Tri-View Portrait ===== */
  .brand-panel{
    position:relative;overflow:hidden;
    background:#0b1322;
    border-left:1px solid rgba(255,255,255,.06);
  }
  .brand-panel img{
    width:100%;height:100%;display:block;
    object-fit:cover;object-position:50% 22%;
    filter:saturate(.9) contrast(1.04) brightness(.72);
  }
  .brand-panel::before{
    content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg,rgba(7,11,22,.92),rgba(7,11,22,.28) 35%,rgba(7,11,22,.10)),
               linear-gradient(0deg,rgba(7,11,22,.72),transparent 44%);
  }
  .brand-panel::after{
    content:"";position:absolute;left:0;top:7%;bottom:7%;width:2px;z-index:2;
    background:linear-gradient(180deg,transparent,var(--cyan),var(--blue),var(--violet),transparent);
  }

  .page-mark{position:absolute;right:38px;top:42px;z-index:4;font-size:11px;color:rgba(255,255,255,.52);font-weight:700;letter-spacing:2px}

  @media(max-width:900px){
    .slide{grid-template-columns:1fr}.brand-panel{display:none}.content{padding:40px}.chapter{grid-template-columns:78px 1fr}.num{font-size:34px}
  }
</style>
</head>
<body>
<main class="slide">
  <section class="content">
    <div class="heading"><h1>目录</h1><div class="en">CONTENTS</div></div>
    <div class="subtitle">Vera · Trusted AI Research Infrastructure</div>
    <div class="rule"></div>

    <div class="chapters">
      <div class="chapter" style="--accent:var(--cyan)">
        <div class="num">01</div>
        <div class="ch-info">
          <div class="chapter-title">为什么金融行业仍不敢相信 AI</div>
          <div class="chapter-detail">AI 幻觉成本 · Vera 价值定位</div>
        </div>
      </div>
      <div class="chapter" style="--accent:var(--blue)">
        <div class="num">02</div>
        <div class="ch-info">
          <div class="chapter-title">可信如何建成</div>
          <div class="chapter-detail">Trust Gate · Continuous Research Loop · Company Panorama · 投研工作台</div>
        </div>
      </div>
      <div class="chapter" style="--accent:var(--violet)">
        <div class="num">03</div>
        <div class="ch-info">
          <div class="chapter-title">为什么 Vera 能做到</div>
          <div class="chapter-detail">可信整体架构 · Research Runtime</div>
        </div>
      </div>
      <div class="chapter" style="--accent:var(--orange)">
        <div class="num">04</div>
        <div class="ch-info">
          <div class="chapter-title">如何实现商业价值</div>
          <div class="chapter-detail">商业模式 · 未来愿景</div>
        </div>
      </div>
    </div>
  </section>

  <aside class="brand-panel" aria-label="Vera 三视图">
    <img src="assets/vera-portrait-tri-view.png" alt="Vera 金融研究智能体三视图">
    <div class="page-mark">VERA · 2026</div>
  </aside>
</main>
</body>
</html>
