<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vera · 生产网站 · Hero 首页</title>
<link rel="stylesheet" href="deck.css">
<style>
  .showcase{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:8px; z-index:2}
  .showcase img{max-width:100%; max-height:70vh; border-radius:16px; border:1px solid var(--stroke); box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .tag-row{display:flex; gap:10px; margin-top:14px}
  .tag{font-size:14px; padding:6px 16px; border-radius:999px; background:rgba(55,230,216,.12); border:1px solid rgba(55,230,216,.35); color:var(--cyan); font-weight:700}
</style>
</head>
<body>
<div class="slide">
  <div class="head">
    <div class="h-title"><span style="background:linear-gradient(110deg, var(--cyan), var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent">touziagent.com</span> · 产品首页</div>
    <div class="h-sub">已上线生产环境 · 119.28.156.125 · 腾讯云 Lighthouse · HTTPS 全链路</div>
  </div>
  <div class="showcase">
    <img src="assets/hero-homepage.png" alt="touziagent.com Hero 首页截图">
    <div class="tag-row">
      <span class="tag">市场情报看板</span>
      <span class="tag">Vera 架构演示</span>
      <span class="tag">公司全景分析</span>
      <span class="tag">多端触达入口</span>
    </div>
  </div>
  <div class="foot">
    <div class="slogan">从<span class="accent">AI 能力</span>到<span class="accent">生产交付</span>，Vera 不是一个 PPT 产品</div>
    <div class="brand">touziagent.com<br>生产环境 · 已上线</div>
  </div>
</div>
</body>
</html>
