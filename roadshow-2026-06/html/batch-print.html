<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>批量导出PDF - Vera路演PPT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0a0a14 0%, #1a1a2e 100%);
    color: #fff;
    padding: 40px;
    min-height: 100vh;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 40px;
  }
  h1 {
    font-size: 32px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #4ea8ff, #9b6bff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    color: #999;
    margin-bottom: 30px;
    font-size: 14px;
  }
  .status {
    background: rgba(78,168,255,.1);
    border: 1px solid rgba(78,168,255,.3);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .progress {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #4ea8ff;
  }
  .current {
    color: #ccc;
    font-size: 14px;
  }
  .list {
    margin-top: 30px;
  }
  .item {
    padding: 12px;
    margin: 8px 0;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item.done {
    background: rgba(55,230,216,.1);
    border-color: rgba(55,230,216,.3);
  }
  .item.current {
    background: rgba(78,168,255,.15);
    border-color: rgba(78,168,255,.5);
  }
  .badge {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.pending { background: rgba(255,255,255,.1); color: #999; }
  .badge.done { background: rgba(55,230,216,.2); color: #37e6d8; }
  .badge.current { background: rgba(78,168,255,.3); color: #4ea8ff; }
  button {
    background: linear-gradient(135deg, #4ea8ff, #9b6bff);
    border: none;
    color: #fff;
    padding: 14px 32px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
    width: 100%;
  }
  button:hover {
    opacity: 0.9;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .instructions {
    margin-top: 30px;
    padding: 20px;
    background: rgba(255,107,193,.1);
    border: 1px solid rgba(255,107,193,.3);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
  }
  .instructions h3 {
    margin-bottom: 10px;
    color: #ff6bc1;
  }
  iframe { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Vera 路演 PPT 批量导出</h1>
  <div class="subtitle">自动打开每一页，手动按 Cmd+P 导出为PDF</div>

  <div class="status">
    <div class="progress" id="progress">准备导出 16 页</div>
    <div class="current" id="current">点击"开始导出"按钮开始</div>
  </div>

  <button id="startBtn" onclick="startExport()">开始导出</button>
  <button id="nextBtn" onclick="nextSlide()" style="display:none">下一页 (或按空格键)</button>

  <div class="list" id="list"></div>

  <div class="instructions">
    <h3>📋 操作说明</h3>
    <p>1. 点击"开始导出"，系统会自动打开第一页</p>
    <p>2. 按 <strong>Cmd+P</strong>，选择"存储为PDF"，布局选"横向"，取消"页眉页脚"</p>
    <p>3. 保存后，点击"下一页"按钮（或按空格键）</p>
    <p>4. 重复步骤2-3，直到所有页面导出完成</p>
  </div>
</div>

<iframe id="iframe"></iframe>

<script>
const slides = [
  {src:"fig-cover-vera-portraits.html",       name:"01-天玑封面"},
  {src:"fig-contents.html",                   name:"02-目录"},
  {src:"fig-hook-why-not-trust.html",         name:"03-为什么不敢相信AI"},
  {src:"fig-pain-triangle.html",              name:"04-AI幻觉的成本"},
  {src:"fig1-cover.html",                     name:"05-Vera管理幻觉"},
  {src:"fig-general-ai-vs-vera.html",         name:"06-通用AI-vs-Vera"},
  {src:"fig3-trust-gate-flow.html",           name:"07-Trust-Gate"},
  {src:"fig-daily-research-loop.html",        name:"08-持续研究闭环"},
  {src:"fig-company-panorama.html",           name:"09-公司拜访速查卡"},
  {src:"fig-workbench.html",                  name:"10-真实工作台"},
  {src:"fig2-vera-overall-architecture.html", name:"11-可信如何建成"},
  {src:"fig4-research-runtime.html",          name:"12-Research-Runtime"},
  {src:"fig5-skill-ecosystem.html",           name:"13-核心10页Skill"},
  {src:"fig-enterprise-architecture-v1.html", name:"14-业务验证与行业开放"},
  {src:"fig-multichannel-satellite.html",     name:"15-多场景触达"},
  {src:"fig7-closing.html",                   name:"16-收官"},
];

let currentIndex = -1;

function init() {
  const list = document.getElementById('list');
  slides.forEach((slide, i) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.id = `item-${i}`;
    item.innerHTML = `
      <span>${slide.name}</span>
      <span class="badge pending" id="badge-${i}">待导出</span>
    `;
    list.appendChild(item);
  });
}

function startExport() {
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';
  nextSlide();
}

function nextSlide() {
  if (currentIndex >= 0) {
    document.getElementById(`badge-${currentIndex}`).textContent = '已完成';
    document.getElementById(`badge-${currentIndex}`).className = 'badge done';
    document.getElementById(`item-${currentIndex}`).className = 'item done';
  }

  currentIndex++;

  if (currentIndex >= slides.length) {
    document.getElementById('progress').textContent = '✅ 全部完成！';
    document.getElementById('current').textContent = '所有页面已导出完成';
    document.getElementById('nextBtn').style.display = 'none';
    return;
  }

  const slide = slides[currentIndex];
  document.getElementById('progress').textContent = `正在导出: ${currentIndex + 1} / ${slides.length}`;
  document.getElementById('current').textContent = slide.name;
  document.getElementById(`item-${currentIndex}`).className = 'item current';
  document.getElementById(`badge-${currentIndex}`).textContent = '当前';
  document.getElementById(`badge-${currentIndex}`).className = 'badge current';

  // 在新标签页打开
  window.open(slide.src, '_blank');
}

// 空格键快捷键
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && currentIndex >= 0) {
    e.preventDefault();
    nextSlide();
  }
});

init();
</script>
</body>
</html>
