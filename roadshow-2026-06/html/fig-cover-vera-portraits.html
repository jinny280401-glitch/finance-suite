<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>天玑 · Vera 你的智能伙伴</title>
<link rel="stylesheet" href="deck.css">
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:#000}
  .stage{
    position:relative; width:100%; min-height:100vh; overflow:hidden;
    background: radial-gradient(ellipse 80% 70% at 50% 50%, #1a1a2e 0%, #0a0a14 60%, #050510 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 40px;
    gap: 20px;
  }
  .stage::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 30%, rgba(78,168,255,.12) 0%, transparent 35%),
      radial-gradient(circle at 85% 30%, rgba(255,107,193,.10) 0%, transparent 35%),
      radial-gradient(circle at 50% 90%, rgba(155,107,255,.08) 0%, transparent 50%);
    pointer-events:none;
  }

  .bg-photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:.35;
    filter: blur(1px);
    z-index:0;
  }

  .title-block{
    position:relative; z-index:5; text-align:center;
  }
  .title-block .eyebrow{
    font-size:14px; color: var(--cyan);
    font-weight:700; letter-spacing:8px; margin-bottom:16px;
  }
  .title-block h1{
    font-size:48px; font-weight:800; color: var(--ink);
    margin:0; letter-spacing:3px; line-height:1.3;
  }
  .title-block h1 .accent{
    background: linear-gradient(135deg, #4ea8ff 0%, #9b6bff 50%, #ff6bc1 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .title-block .sub{
    font-size:17px; color: var(--sub);
    letter-spacing: 2px; margin-top:12px;
  }
  .title-block .sub .cap{
    background: linear-gradient(90deg, #ff6bc1, #ffb056);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }

  /* 底部人物信息 */
  .text-block{
    position:relative; z-index:5;
    text-align:center;
    margin-top: 12px;
  }
  .text-block .line{
    font-size:15px; color: var(--ink);
    letter-spacing: 1.2px;
    line-height: 1.9;
  }
  .text-block .line .k{ color: var(--sub); margin-right:6px; }
  .text-block .line .v{
    background: linear-gradient(90deg, #4ea8ff, #9b6bff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }
  .text-block .seal{
    margin-top: 10px;
    display:inline-block;
    padding: 5px 18px;
    background: rgba(78,168,255,.10);
    border-radius: 999px;
    font-size: 13px; color: var(--cyan);
    letter-spacing: 2px;
  }

  @media (max-width:860px){
    .title-block h1{ font-size:28px; letter-spacing:1px; }
    .title-block .eyebrow{ letter-spacing:4px; }
    .text-block .line{ font-size:13px; }
  }
</style>
</head>
<body>
<div class="stage">

  <img class="bg-photo" src="assets/page1-bg.png" alt="" />

  <div class="title-block">
    <div class="eyebrow">VERA · YOUR INTELLIGENT PARTNER</div>
    <h1>天玑·金融数据全景分析引擎<br><span class="accent">Vera 你的智能伙伴</span></h1>
    <div class="sub">核心能力　<span class="cap">数据洞察 · 研究分析 · 报告生成 · 趋势追踪</span></div>
  </div>


</div>
</body>
</html>
