<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vera · 工作台 · 投研操作面板</title>
<link rel="stylesheet" href="deck.css">
<style>
  body{padding:0;display:block;overflow:hidden}
  .slide{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;padding:42px 52px 30px}

  .head{margin-bottom:16px}

  .showcase{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:0; z-index:2; gap:14px;
  }
  .showcase img{
    max-width:100%; max-height:62vh; border-radius:16px;
    border:1px solid var(--stroke); box-shadow:0 20px 60px rgba(0,0,0,.45);
    object-fit:contain;
  }
  .tag-row{display:flex; gap:10px; justify-content:center; margin-top:14px}
  .tag{
    font-size:12.5px; padding:5px 14px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    color:var(--sub); font-weight:600;
  }

  /* 金句：一级标题，图片下方 */
  .foot{
    margin-top:18px !important; padding-top:0 !important;
    display:flex !important; align-items:center; justify-content:center;
    z-index:3;
  }
  .slogan{
    font-size:24px !important; font-weight:750; text-align:center; line-height:1.5;
    padding:18px 40px; border-radius:16px;
    background:linear-gradient(180deg,rgba(78,168,255,.10),rgba(155,107,255,.06));
    border:1px solid rgba(120,180,255,.30);
    box-shadow:0 12px 36px rgba(78,168,255,.18), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .brand{display:none}
</style>
</head>
<body>
<div class="slide">

  <div class="head">
    <div class="h-title"><span style="background:linear-gradient(110deg,var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent">工作台</span> · 投研操作面板</div>
    <div class="h-sub">市场情报 · 自选股监控 · 集合竞价 · 研报检索 · 一站式投研入口</div>
  </div>

  <div class="showcase">
    <img src="assets/workbench.png" alt="touziagent.com 工作台截图">
  </div>

  <div class="foot">
    <div class="slogan">从<span class="accent">市场扫描</span>到<span class="accent">深度研究</span>，工作台是投研人员的<span class="accent">AI 驾驶舱</span></div>
  </div>

  <div class="tag-row">
    <span class="tag">集合竞价</span>
    <span class="tag">黄金坑扫描</span>
    <span class="tag">自选股监控</span>
    <span class="tag">研报检索</span>
    <span class="tag">市场情报</span>
  </div>

</div>
</body>
</html>
