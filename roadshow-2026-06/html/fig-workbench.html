<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vera · 生产网站 · 工作台</title>
<link rel="stylesheet" href="deck.css">
<style>
  .showcase{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:8px; z-index:2}
  .showcase img{max-width:100%; max-height:78vh; border-radius:16px; border:1px solid var(--stroke); box-shadow:0 20px 60px rgba(0,0,0,.5); object-fit:contain}
  .tag-row{display:flex; gap:10px; margin-top:14px}
  .tag{font-size:14px; padding:6px 16px; border-radius:999px; background:rgba(78,168,255,.12); border:1px solid rgba(78,168,255,.35); color:var(--blue); font-weight:700}
</style>
</head>
<body>
<div class="slide">
  <div class="head">
    <div class="h-title"><span style="background:linear-gradient(110deg, var(--blue), var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent">工作台</span> · 投研操作面板</div>
    <div class="h-sub">市场情报 · 自选股监控 · 集合竞价 · 研报检索 · 一站式投研入口</div>
  </div>
  <div class="showcase">
    <img src="assets/workbench.png" alt="touziagent.com 工作台截图">
    <div class="tag-row">
      <span class="tag">集合竞价</span>
      <span class="tag">黄金坑扫描</span>
      <span class="tag">自选股监控</span>
      <span class="tag">研报检索</span>
      <span class="tag">市场情报</span>
    </div>
  </div>
  <div class="foot">
    <div class="slogan">从<span class="accent">市场扫描</span>到<span class="accent">深度研究</span>，工作台是投研人员的<span class="accent">AI 驾驶舱</span></div>
    <div class="brand">touziagent.com · 工作台<br>生产环境 · 已上线</div>
  </div>
</div>
</body>
</html>
