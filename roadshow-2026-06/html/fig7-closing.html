<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收官</title>
<link rel="stylesheet" href="deck.css">
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:#000}
  .stage{
    position:relative; width:100%; height:100vh; overflow:hidden;
    background:#000;
  }
  .bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; object-position: center 30%;
  }
  .vignette{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.50) 100%);
    z-index:2; pointer-events:none;
  }
  .overlay{
    position:absolute; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding-bottom: 12vh;
    text-align:center;
  }
  .tagline{
    font-size:clamp(26px,3.6vw,48px); font-weight:800; color:#fff;
    letter-spacing:2px; line-height:1.3;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .tagline .hl{
    background:linear-gradient(110deg, var(--cyan), var(--blue), var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{
    margin-top:18px; font-size:clamp(16px,2vw,26px); color:rgba(255,255,255,.7);
    font-weight:500; letter-spacing:1px;
    text-shadow:0 1px 10px rgba(0,0,0,.5);
  }
  .thanks{
    margin-top:28px; font-size:clamp(18px,2.4vw,30px); color:rgba(255,255,255,.75);
    font-weight:600; letter-spacing:2px;
    text-shadow:0 1px 10px rgba(0,0,0,.5);
  }
  .brand-line{
    position:absolute; bottom:5vh; right:6vw; z-index:3;
    font-size:12px; color:rgba(255,255,255,.45); text-align:right;
  }
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="assets/vera-ppt-closing.png" alt="Vera 可信金融 AI 研究伙伴" />
  <div class="vignette"></div>
  <div class="overlay">
    <div class="tagline">
      让金融行业，第一次敢把 <span class="hl">AI 的研究结果</span> 交给客户
    </div>
    <div class="sub">Vera · 可信金融 AI 研究伙伴</div>
    <div class="thanks">感谢聆听，欢迎提问</div>
  </div>
  <div class="brand-line">Vera Agent · 证券行业可信研究智能体</div>
</div>
</body>
</html>
