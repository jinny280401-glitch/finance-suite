<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PPT 第 1 页 · 投研助手 VERA AGENT</title>
<link rel="stylesheet" href="deck.css">
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:#000}
  .stage{position:relative;width:100%;height:100vh;overflow:hidden;background:#000}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%);z-index:2;pointer-events:none}
  .overlay{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .overlay h2{font-size:56px;font-weight:800;color:#fff;letter-spacing:3px;margin:0;text-shadow:0 2px 20px rgba(0,0,0,.6)}
  .overlay .sub{font-size:22px;color:rgba(255,255,255,.7);margin-top:16px;letter-spacing:1px}
  .chip-row{display:flex;gap:14px;margin-top:32px}
  .chip{padding:10px 22px;border-radius:999px;font-size:16px;font-weight:700;border:1px solid rgba(55,230,216,.35);color:var(--cyan);background:rgba(55,230,216,.08)}
  .top-bar{position:absolute;top:40px;left:0;right:0;z-index:4;display:flex;justify-content:space-between;padding:0 60px}
  .top-bar span{font-size:14px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:2px}
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="assets/page1-bg.png" alt="" />
  <img src="assets/page1-info.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:3;mix-blend-mode:lighten" />
</div>
</body>
</html>
