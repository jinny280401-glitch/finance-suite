<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Temperature Mini Card</title>
  <link rel="stylesheet" href="./market-temperature-mini.css">
</head>
<body>
  <aside class="mt-mini-sidebar-preview" aria-label="Sidebar preview">
    <section class="mt-mini-card" aria-label="市场温度">
      <div class="mt-mini-header">
        <div>
          <p class="mt-mini-kicker">Market Structure</p>
          <h2 class="mt-mini-title">市场温度</h2>
        </div>
        <span class="mt-mini-status" data-mt-status>--</span>
      </div>

      <div class="mt-mini-metrics" data-mt-metrics></div>

      <div class="mt-mini-themes">
        <div class="mt-mini-section-title">主线热度</div>
        <div class="mt-mini-theme-list" data-mt-themes></div>
      </div>

      <div class="mt-mini-footer">
        <span class="mt-mini-risk" data-mt-risk>--</span>
        <div class="mt-mini-links">
          <a class="mt-mini-link" href="/app/weekly-recap.html" target="_self" aria-label="本周复盘">📋 本周复盘</a>
          <a class="mt-mini-link" href="/app/market-snapshot.html" target="_self" aria-label="查看市场画像">查看市场画像 →</a>
        </div>
      </div>
    </section>
  </aside>

  <script src="./market-temperature-fixture.js"></script>
  <script>
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMarketTemperature(data) {
      const card = document.querySelector(".mt-mini-card");
      if (!card || !data) return;

      card.querySelector("[data-mt-status]").textContent = data.status;
      card.querySelector("[data-mt-risk]").textContent = data.riskNote;

      const metricsContainer = card.querySelector("[data-mt-metrics]");
      metricsContainer.innerHTML = '';
      data.metrics.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'mt-mini-metric';
        const label = document.createElement('span');
        label.className = 'mt-mini-metric-label';
        label.textContent = item.label;
        const value = document.createElement('strong');
        value.className = 'mt-mini-metric-value' + (item.tone ? ` mt-mini-metric-value--${item.tone}` : '');
        value.textContent = item.value;
        div.appendChild(label);
        div.appendChild(value);
        metricsContainer.appendChild(div);
      });

      const themesContainer = card.querySelector("[data-mt-themes]");
      themesContainer.innerHTML = '';
      data.themes.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'mt-mini-theme';
        const name = document.createElement('span');
        name.className = 'mt-mini-theme-name';
        name.textContent = item.name;
        const count = document.createElement('strong');
        count.className = 'mt-mini-theme-count';
        count.textContent = item.count;
        div.appendChild(name);
        div.appendChild(count);
        themesContainer.appendChild(div);
      });
    }

    renderMarketTemperature(window.marketTemperatureFixture);
  </script>
</body>
</html>
