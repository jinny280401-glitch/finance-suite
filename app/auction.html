<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>集合竞价 — Finance Suite</title>
  <script>
    const isLocalDemo = ['localhost', '127.0.0.1'].includes(location.hostname);
    if (!isLocalDemo && localStorage.getItem('fs_auth') !== 'ok') {
      location.replace('/?redirect=/app/auction.html');
    }
  </script>
  <style>
    :root {
      --white: #ffffff;
      --surface: #f5f5f7;
      --surface-2: #fafafa;
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --text-tertiary: #a1a1a6;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-soft: rgba(0,113,227,0.08);
      --border: rgba(0,0,0,0.08);
      --border-light: rgba(0,0,0,0.04);
      --radius: 14px;
      --radius-sm: 10px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
      background: var(--surface);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-top: 52px;
    }

    /* Header */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border-light);
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 22px;
    }
    .site-header__inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-header__brand {
      font-size: 14px; font-weight: 600; color: var(--text);
      text-decoration: none; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 10px;
    }
    .site-header__brand::after {
      content: '集合竞价';
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 3px 8px;
      background: var(--surface);
      border-radius: 6px;
    }
    .hdr-actions { display: flex; align-items: center; gap: 10px; }
    .hdr-btn {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .hdr-btn--secondary {
      background: var(--surface);
      color: var(--text);
    }
    .hdr-btn--secondary:hover { background: var(--border); }

    /* Main */
    .main-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .page-head {
      margin-bottom: 32px;
    }
    .page-head__title {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 8px;
    }
    .page-head__desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Input Form */
    .analyze-form {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      display: block;
    }
    .form-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface-2);
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .form-input::placeholder { color: var(--text-tertiary); }
    .form-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.15s var(--ease);
      width: 100%;
    }
    .form-submit:hover { background: var(--accent-hover); }
    .form-submit:active { transform: scale(0.98); }
    .form-submit:disabled {
      background: var(--border);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    /* Result */
    .result-container {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: none;
    }
    .result-container.show { display: block; }
    .result-loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .result-loading__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .result-content {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
    }
    .result-content pre {
      background: var(--surface);
      padding: 16px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      font-size: 14px;
      margin: 16px 0;
    }
    .result-error {
      color: #d32f2f;
      padding: 16px;
      background: rgba(211, 47, 47, 0.08);
      border-radius: var(--radius-sm);
    }
    .qc-panel {
      margin: 14px 0;
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.6;
    }
    .qc-panel__title {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .qc-panel__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 4px 12px;
    }
    .qc-panel__warning {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(230, 126, 34, 0.10);
      color: #b95f00;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/app/" class="site-header__brand">Finance Suite</a>
      <div class="hdr-actions">
        <a href="/app/" class="hdr-btn hdr-btn--secondary">← 返回工作台</a>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="page-head">
      <h1 class="page-head__title">集合竞价</h1>
      <p class="page-head__desc">涨停排行 + 量化选股信号</p>
    </div>

    <form class="analyze-form" id="analyzeForm">
      <label class="form-label" for="queryInput">输入日期或直接点击分析今日数据</label>
      <input
        type="text"
        id="queryInput"
        class="form-input"
        placeholder="留空分析今日，或输入日期如：2026-04-14"
      >
      <button type="submit" class="form-submit" id="submitBtn">开始分析</button>
    </form>

    <div class="result-container" id="resultContainer">
      <div class="result-loading" id="resultLoading">
        <div class="result-loading__spinner"></div>
        <div>正在分析中，请稍候...</div>
      </div>
      <div class="result-content" id="resultContent"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById('analyzeForm');
    const queryInput = document.getElementById('queryInput');
    const submitBtn = document.getElementById('submitBtn');
    const resultContainer = document.getElementById('resultContainer');
    const resultLoading = document.getElementById('resultLoading');
    const resultContent = document.getElementById('resultContent');

    const GOLDEN_PIT_TRIGGERS = ['黄金坑', '四重门', 'hjk'];

    function isGoldenPitQuery(query) {
      return GOLDEN_PIT_TRIGGERS.some(t => query.includes(t));
    }

    async function readJsonOrThrow(resp, fallbackMessage) {
      const text = await resp.text();
      try {
        return text ? JSON.parse(text) : {};
      } catch (e) {
        const preview = text
          .replace(/<script[\s\S]*?<\/script>/gi, '')
          .replace(/<style[\s\S]*?<\/style>/gi, '')
          .replace(/<[^>]+>/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 120);
        throw new Error(`${fallbackMessage}：接口返回的不是 JSON${preview ? `（${preview}）` : ''}`);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = queryInput.value.trim();
      const goldenPit = isGoldenPitQuery(query);

      resultContainer.classList.add('show');
      resultLoading.style.display = 'block';
      resultContent.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = goldenPit ? '扫描中...' : '分析中...';

      try {
        let data;
        if (goldenPit) {
          const useRealtime = query.includes('实时');
          const url = `/api/intel/golden-pit${useRealtime ? '?realtime=true' : ''}`;
          const resp = await fetch(url, { credentials: 'include' });
          data = await readJsonOrThrow(resp, '扫描失败');
          if (!resp.ok) throw new Error(data.detail || '扫描失败');
          resultContent.innerHTML = formatGoldenPit(data);
        } else {
          const resp = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ skill_type: 'auction', query }),
            credentials: 'include'
          });
          data = await readJsonOrThrow(resp, '分析失败');
          if (!resp.ok) throw new Error(data.detail || '分析失败');
          resultContent.innerHTML = formatResult(data);
        }

        resultLoading.style.display = 'none';
        resultContent.style.display = 'block';

      } catch (error) {
        resultLoading.style.display = 'none';
        resultContent.style.display = 'block';
        resultContent.innerHTML = `<div class="result-error">错误：${error.message}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '开始分析';
      }
    });

    function formatGoldenPit(data) {
      const hits = data.hits || [];
      const watchlist = data.watchlist || [];
      const env = data.market_env || {};
      const qc = data._qc || {};

      let html = `<div style="font-family:monospace;font-size:13px;line-height:1.8">`;
      html += `<div style="font-weight:bold;font-size:15px;margin-bottom:8px">黄金坑四重门扫描结果</div>`;
      html += `<div style="color:#888;margin-bottom:12px">数据时间：${data.scan_date || '今日'} | 市场环境：${env.status || '未知'}`;
      if (qc.completeness !== undefined) html += ` | 数据完整度：${Math.round(qc.completeness * 100)}%`;
      html += `</div>`;

      html += `<div style="font-weight:bold;color:#e74c3c;margin-bottom:6px">命中（四重门全过）：${hits.length} 只</div>`;
      if (hits.length === 0) {
        html += `<div style="color:#888;margin-bottom:12px">今日无命中</div>`;
      } else {
        hits.forEach((s, i) => {
          html += `<div style="margin-bottom:4px">${i+1}. <b>${s.code}</b> 收盘${s.close} 综合评分${s.composite || '-'} 距下轨${s.dist_to_lower_pct}%</div>`;
        });
        html += `<br>`;
      }

      html += `<div style="font-weight:bold;color:#e67e22;margin-bottom:6px">观察池（G1-G3过，等待反弹）：${watchlist.length} 只</div>`;
      if (watchlist.length === 0) {
        html += `<div style="color:#888">暂无</div>`;
      } else {
        watchlist.slice(0, 10).forEach((s, i) => {
          const dist = s.dist_to_lower_pct;
          const distStr = dist < 0 ? `已破轨${Math.abs(dist)}%` : `距下轨${dist}%`;
          html += `<div style="margin-bottom:4px">${i+1}. <b>${s.code}</b> 收盘${s.close} ${distStr}${s.at_lower_now ? ' ⚡已触轨' : ''}</div>`;
        });
      }

      html += renderQcPanel(qc);
      html += `<div style="color:#aaa;margin-top:12px;font-size:11px">免责声明：量化信号仅供参考，不构成投资建议</div>`;
      html += `</div>`;
      return html;
    }

    function formatResult(data) {
      if (typeof data === 'string') {
        return `<pre>${data}</pre>`;
      }
      const qcPanel = renderQcPanel(data._qc || {});
      return `${qcPanel}<pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
    }

    function renderQcPanel(qc) {
      if (!qc || Object.keys(qc).length === 0) return '';
      const completeness = typeof qc.completeness === 'number' ? `${Math.round(qc.completeness * 100)}%` : '未知';
      const sources = Array.isArray(qc.sources) && qc.sources.length ? qc.sources.join(' / ') : '未知';
      const fallback = qc.fallback_source || '无';
      const missing = Array.isArray(qc.missing_dimensions) && qc.missing_dimensions.length ? qc.missing_dimensions.join(' / ') : '无';
      const stale = Array.isArray(qc.stale_data) ? qc.stale_data : [];
      const staleText = stale.map(item => {
        if (!item || typeof item !== 'object') return String(item);
        const date = item.data_date ? `数据日期 ${item.data_date}` : '';
        const reason = item.reason || item.message || '数据可能延迟';
        return [date, reason].filter(Boolean).join('，');
      }).join('；');

      let html = `<div class="qc-panel">`;
      html += `<div class="qc-panel__title">数据质检 / 信源</div>`;
      html += `<div class="qc-panel__grid">`;
      html += `<div>status：${escapeHtml(qc.status || 'unknown')}</div>`;
      html += `<div>completeness：${escapeHtml(completeness)}</div>`;
      html += `<div>sources：${escapeHtml(sources)}</div>`;
      html += `<div>fallback_source：${escapeHtml(fallback)}</div>`;
      html += `<div>missing：${escapeHtml(missing)}</div>`;
      html += `<div>stale_data：${stale.length ? escapeHtml(staleText || '存在') : '无'}</div>`;
      html += `</div>`;
      if (stale.length) {
        html += `<div class="qc-panel__warning">旧数据/试用账号延迟：${escapeHtml(staleText || '当前结果包含延迟或过期数据')}</div>`;
      }
      html += `</div>`;
      return html;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Pre-fill from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const preQuery = urlParams.get('q');
    if (preQuery) {
      queryInput.value = preQuery;
    }
  </script>
</body>
</html>
