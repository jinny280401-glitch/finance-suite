<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>集合竞价 — Finance Suite</title>
  <script>
    const isLocalDemo = ['localhost', '127.0.0.1'].includes(location.hostname);
    if (!isLocalDemo && localStorage.getItem('fs_auth') !== 'ok') {
      location.replace('/?redirect=/app/auction.html');
    }
  </script>
  <style>
    :root {
      --white: #ffffff;
      --surface: #f5f5f7;
      --surface-2: #fafafa;
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --text-tertiary: #a1a1a6;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-soft: rgba(0,113,227,0.08);
      --border: rgba(0,0,0,0.08);
      --border-light: rgba(0,0,0,0.04);
      --radius: 14px;
      --radius-sm: 10px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
      background: var(--surface);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-top: 52px;
    }

    /* Header */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border-light);
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 22px;
    }
    .site-header__inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-header__brand {
      font-size: 14px; font-weight: 600; color: var(--text);
      text-decoration: none; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 10px;
    }
    .site-header__brand::after {
      content: '集合竞价';
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 3px 8px;
      background: var(--surface);
      border-radius: 6px;
    }
    .hdr-actions { display: flex; align-items: center; gap: 10px; }
    .hdr-btn {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .hdr-btn--secondary {
      background: var(--surface);
      color: var(--text);
    }
    .hdr-btn--secondary:hover { background: var(--border); }

    /* Main */
    .main-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .page-head {
      margin-bottom: 32px;
    }
    .page-head__title {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 8px;
    }
    .page-head__desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Input Form */
    .analyze-form {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      display: block;
    }
    .form-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface-2);
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .form-input::placeholder { color: var(--text-tertiary); }
    .form-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.15s var(--ease);
      width: 100%;
    }
    .form-submit:hover { background: var(--accent-hover); }
    .form-submit:active { transform: scale(0.98); }
    .form-submit:disabled {
      background: var(--border);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    /* Result */
    .result-container {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: none;
    }
    .result-container.show { display: block; }
    .result-loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .result-loading__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .result-content {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
    }
    .result-content pre {
      background: var(--surface);
      padding: 16px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      font-size: 14px;
      margin: 16px 0;
    }
    .result-error {
      color: #d32f2f;
      padding: 16px;
      background: rgba(211, 47, 47, 0.08);
      border-radius: var(--radius-sm);
    }
    .qc-panel {
      margin: 14px 0;
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.6;
    }
    .qc-panel__title {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .qc-panel__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 4px 12px;
    }
    .qc-panel__warning {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(230, 126, 34, 0.10);
      color: #b95f00;
      font-weight: 500;
    }

    /* Markdown report (auction /api/analyze) — card-style render */
    .report-meta {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 16px;
      line-height: 1.7;
    }
    .report-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin-bottom: 14px;
      background: var(--surface-2);
      overflow-x: auto;
    }
    .report-card__title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
    }
    .report-card h1, .report-card h2, .report-card h3, .report-card h4 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin: 16px 0 8px;
    }
    .report-card p { margin: 8px 0; }
    .report-card ul, .report-card ol { margin: 8px 0 8px 20px; }
    .report-card li { margin: 4px 0; }
    .report-card strong { font-weight: 600; color: var(--text); }
    .report-card table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }
    .report-card th, .report-card td {
      border: 1px solid var(--border);
      padding: 7px 10px;
      text-align: left;
    }
    .report-card th {
      background: var(--surface);
      font-weight: 600;
      white-space: nowrap;
    }
    .report-card blockquote {
      margin: 12px 0;
      padding: 8px 14px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--text-secondary);
      border-radius: 0 8px 8px 0;
      font-size: 13px;
    }
    .report-card hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }
    .report-card code {
      background: var(--surface);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 13px;
    }
    .report-disclaimer {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-tertiary);
      line-height: 1.6;
    }
  </style>
  <script src="marked.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/app/" class="site-header__brand">Finance Suite</a>
      <div class="hdr-actions">
        <a href="/app/" class="hdr-btn hdr-btn--secondary">← 返回工作台</a>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="page-head">
      <h1 class="page-head__title">集合竞价强势候选池</h1>
      <p class="page-head__desc">东方财富集合竞价实时数据 · 强势股 + 昨日涨停追踪</p>
    </div>
    <form class="analyze-form" id="analyzeForm">
      <label class="form-label" for="queryInput">输入日期或直接点击分析今日数据</label>
      <input
        type="text"
        id="queryInput"
        class="form-input"
        placeholder="留空分析今日，或输入日期如：2026-04-14"
      >
      <button type="submit" class="form-submit" id="submitBtn">开始分析</button>
    </form>

    <div class="result-container" id="resultContainer">
      <div class="result-loading" id="resultLoading">
        <div class="result-loading__spinner"></div>
        <div>正在分析中，请稍候...</div>
      </div>
      <div class="result-content" id="resultContent"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById('analyzeForm');
    const queryInput = document.getElementById('queryInput');
    const submitBtn = document.getElementById('submitBtn');
    const resultContainer = document.getElementById('resultContainer');
    const resultLoading = document.getElementById('resultLoading');
    const resultContent = document.getElementById('resultContent');

    const GOLDEN_PIT_TRIGGERS = ['黄金坑', '四重门', 'hjk'];

    function isGoldenPitQuery(query) {
      return GOLDEN_PIT_TRIGGERS.some(t => query.includes(t));
    }

    async function readJsonOrThrow(resp, fallbackMessage) {
      const text = await resp.text();
      try {
        return text ? JSON.parse(text) : {};
      } catch (e) {
        const preview = text
          .replace(/<script[\s\S]*?<\/script>/gi, '')
          .replace(/<style[\s\S]*?<\/style>/gi, '')
          .replace(/<[^>]+>/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 120);
        throw new Error(`${fallbackMessage}：接口返回的不是 JSON${preview ? `（${preview}）` : ''}`);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const query = queryInput.value.trim();
      const goldenPit = isGoldenPitQuery(query);

      resultContainer.classList.add('show');
      resultLoading.style.display = 'block';
      resultContent.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = goldenPit ? '扫描中...' : '分析中...';

      try {
        let data;
        if (goldenPit) {
          const useRealtime = query.includes('实时');
          const traceToken = crypto.randomUUID();
          const url = `/api/intel/golden-pit?trace_token=${encodeURIComponent(traceToken)}${useRealtime ? '&realtime=true' : ''}`;
          const resp = await fetch(url, { credentials: 'include' });
          data = await readJsonOrThrow(resp, '扫描失败');
          if (!resp.ok) throw new Error(data.detail || '扫描失败');
          resultContent.innerHTML = formatGoldenPit(data);
        } else {
          const resp = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ skill_type: 'auction', query }),
            credentials: 'include'
          });
          data = await readJsonOrThrow(resp, '分析失败');
          if (!resp.ok) throw new Error(data.detail || '分析失败');
          resultContent.innerHTML = formatResult(data);
        }

        resultLoading.style.display = 'none';
        resultContent.style.display = 'block';

      } catch (error) {
        resultLoading.style.display = 'none';
        resultContent.style.display = 'block';
        resultContent.innerHTML = `<div class="result-error">错误：${error.message}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '开始分析';
      }
    });

    function formatGoldenPit(data) {
      // Handle unexpected response shape gracefully
      if (!data || typeof data !== 'object') {
        return `<div class="result-error">数据不可用：接口返回格式异常</div>`;
      }

      const items = Array.isArray(data.data) ? data.data : [];
      const count = typeof data.count === 'number' ? data.count : items.length;
      const qc = data._qc || {};

      // Empty state — consume backend candidate_conclusion, do NOT reinterpret None/[] here
      if (count === 0 || (items.length === 0 && count === 0)) {
        const conclusion = (data.algorithm && data.algorithm.candidate_filtering)
          ? data.algorithm.candidate_filtering.candidate_conclusion : null;
        let emptyMessage;
        if (conclusion === 'healthy_inputs_zero_matches') {
          emptyMessage = `<div style="color:#2e7d32;padding:12px;background:rgba(46,125,50,0.08);border-radius:8px;margin-bottom:12px">扫描完成：当前无符合条件的强势候选</div>`;
        } else if (conclusion === 'indeterminate') {
          emptyMessage = `<div style="color:#c0392b;padding:12px;background:rgba(192,57,43,0.08);border-radius:8px;margin-bottom:12px">数据源异常，无法判断是否存在候选，请稍后重试</div>`;
        } else if (conclusion === 'pre_auction_observation') {
          emptyMessage = `<div style="color:#e67e22;padding:12px;background:rgba(230,126,34,0.08);border-radius:8px;margin-bottom:12px">集合竞价进行中（09:15–09:25），结果尚未确定，当前仅可观察，09:25 后生成候选池</div>`;
        } else {
          emptyMessage = `<div style="color:#e67e22;padding:12px;background:rgba(230,126,34,0.08);border-radius:8px;margin-bottom:12px">数据状态未知（接口未返回扫描结论）</div>`;
        }
        let html = `<div style="font-family:monospace;font-size:13px;line-height:1.8">`;
        html += `<div style="font-weight:bold;font-size:15px;margin-bottom:8px">集合竞价强势候选池</div>`;
        html += `<div style="color:#888;margin-bottom:12px">数据时间：${qc.generated_at || '今日'} | 数据来源：东方财富集合竞价</div>`;
        html += emptyMessage;
        html += renderQcPanel(qc);
        html += `<div style="color:#aaa;margin-top:12px;font-size:11px">免责声明：数据仅供参考，不构成投资建议</div>`;
        html += `</div>`;
        return html;
      }

      const source = (qc.sources && qc.sources.length) ? qc.sources[0] : '东方财富';
      const isReal = qc.source_type === 'real';
      const generatedAt = qc.generated_at || '';

      let html = `<div style="font-family:monospace;font-size:13px;line-height:1.8">`;

      // Header — capability name, NOT Golden Pit
      html += `<div style="font-weight:bold;font-size:15px;margin-bottom:8px">集合竞价强势候选池</div>`;
      html += `<div style="color:#888;margin-bottom:4px">数据来源：东方财富集合竞价（${escapeHtml(source)}）`;
      if (!isReal) html += ` <span style="color:#e67e22">[非实时]</span>`;
      html += `</div>`;
      html += `<div style="color:#888;margin-bottom:12px">数据时间：${escapeHtml(generatedAt || '今日')} | 共 ${count} 只 | 展示前 ${items.length} 只</div>`;

      // Bucket labels
      const bucketLabel = {
        strong_pool: '强势股（60日新高/多次涨停）',
        previous_zt: '昨日涨停今日表现',
        zt_pool: '今日涨停池',
      };

      // Group by source_bucket
      const buckets = {};
      items.forEach(s => {
        const b = s.source_bucket || 'other';
        if (!buckets[b]) buckets[b] = [];
        buckets[b].push(s);
      });

      Object.keys(buckets).forEach(bucket => {
        const bucketItems = buckets[bucket];
        const label = bucketLabel[bucket] || bucket;
        html += `<div style="font-weight:bold;color:#0071e3;margin-top:14px;margin-bottom:6px">${escapeHtml(label)}：${bucketItems.length} 只</div>`;

        bucketItems.forEach((s, i) => {
          const changeStr = s.change != null ? `${s.change > 0 ? '+' : ''}${s.change.toFixed(1)}%` : '-';
          const changeColor = s.change > 0 ? '#e74c3c' : s.change < 0 ? '#27ae60' : '#888';
          html += `<div style="margin-bottom:4px;padding:6px 8px;background:#fafafa;border-radius:6px">`;
          html += `${i+1}. <b>${escapeHtml(s.code)}</b> ${escapeHtml(s.name || '')}`;
          html += ` <span style="color:${changeColor};font-weight:500">${changeStr}</span>`;
          if (s.reason) html += ` <span style="color:#888;font-size:12px">[${escapeHtml(s.reason)}]</span>`;
          html += `</div>`;
        });
      });

      html += renderQcPanel(qc);
      html += `<div style="color:#aaa;margin-top:12px;font-size:11px">免责声明：数据仅供参考，不构成投资建议。集合竞价强势候选池基于东方财富公开数据，非量化因子信号。</div>`;
      html += `</div>`;
      return html;
    }

    function formatResult(data) {
      if (typeof data === 'string') {
        return `<pre>${escapeHtml(data)}</pre>`;
      }
      // Security: allowlist-only. Internal metadata fields (dispatch_trace,
      // qa_result, data_availability, final_seal, usage_*, hallucination_risk,
      // fact_coverage, freshness, report_as_of, section_data_usage) must never
      // reach browser DOM. Only result (the report body) is rendered; the QC
      // panel (renderQcPanel) is already curated.
      const qc = data._qc || {};
      const reportText = typeof data.result === 'string' ? data.result : '';

      let html = '';
      html += renderReportMeta(data, qc);
      html += renderMarkdown(reportText);
      html += renderQcPanel(qc);
      html += `<div class="report-disclaimer">免责声明：以上分析由模型基于公开数据生成，仅供研究参考，不构成投资建议。</div>`;
      return html;
    }

    // Honest quality metadata line, mirroring the golden-pit meta row.
    function renderReportMeta(data, qc) {
      const parts = [];

      const asOf = (data.report_as_of && data.report_as_of.date) || '';
      if (asOf) parts.push('数据日期：' + asOf);

      const completeness = typeof qc.completeness === 'number' ? Math.round(qc.completeness * 100) + '%' : '未知';
      parts.push('数据完整度：' + completeness);

      const sources = Array.isArray(qc.sources) && qc.sources.length ? qc.sources.join(' / ') : '未知';
      parts.push('信源：' + sources);

      const freshness = qc.freshness || {};
      if (freshness.source_date_unknown) {
        parts.push('信源日期未知，内容可能来自模型训练知识');
      } else if (freshness.is_stale) {
        parts.push('数据可能过期');
      }

      const fc = qc.fact_coverage || {};
      if (typeof fc.llm_inference_ratio === 'number') {
        parts.push('模型推断占比：' + Math.round(fc.llm_inference_ratio * 100) + '%');
      }

      if (parts.length === 0) return '';
      return `<div class="report-meta">${parts.map(p => escapeHtml(p)).join(' ｜ ')}</div>`;
    }

    // Split the markdown report by "### " section headings, one card per
    // section, and render each card body through marked.
    function renderMarkdown(text) {
      if (!text) return '<div class="report-card">暂无分析内容</div>';

      const sections = text.split(/^###[ \t]+/m);
      if (sections.length === 1) {
        return `<div class="report-card">${md(sections[0])}</div>`;
      }

      let html = '';
      if (sections[0] && sections[0].trim()) {
        html += `<div class="report-card">${md(sections[0])}</div>`;
      }
      for (let i = 1; i < sections.length; i++) {
        const sec = sections[i];
        const nl = sec.indexOf('\n');
        const title = nl >= 0 ? sec.slice(0, nl) : sec;
        const body = nl >= 0 ? sec.slice(nl + 1) : '';
        html += `<div class="report-card">`
          + `<div class="report-card__title">${escapeHtml(title.trim())}</div>`
          + md(body)
          + `</div>`;
      }
      return html;
    }

    function md(s) {
      if (window.marked && typeof window.marked.parse === 'function') {
        return window.marked.parse(s, { breaks: true, gfm: true });
      }
      return `<pre>${escapeHtml(s)}</pre>`;
    }

    function renderQcPanel(qc) {
      if (!qc || Object.keys(qc).length === 0) return '';
      const completeness = typeof qc.completeness === 'number' ? `${Math.round(qc.completeness * 100)}%` : '未知';
      const sources = Array.isArray(qc.sources) && qc.sources.length ? qc.sources.join(' / ') : '未知';
      const fallback = qc.fallback_source || '无';
      const missing = Array.isArray(qc.missing_dimensions) && qc.missing_dimensions.length ? qc.missing_dimensions.join(' / ') : '无';
      const stale = Array.isArray(qc.stale_data) ? qc.stale_data : [];
      const staleText = stale.map(item => {
        if (!item || typeof item !== 'object') return String(item);
        const date = item.data_date ? `数据日期 ${item.data_date}` : '';
        const reason = item.reason || item.message || '数据可能延迟';
        return [date, reason].filter(Boolean).join('，');
      }).join('；');
      const allowedUse = Array.isArray(qc.allowed_use) && qc.allowed_use.length ? qc.allowed_use.join(' / ') : '—';
      const forbiddenUse = Array.isArray(qc.forbidden_use) && qc.forbidden_use.length ? qc.forbidden_use.join(' / ') : '—';
      const blockedFields = Array.isArray(qc.blocked_fields) && qc.blocked_fields.length ? qc.blocked_fields.join(' / ') : '无';

      let html = `<div class="qc-panel">`;
      html += `<div class="qc-panel__title">数据质检 / 信源</div>`;
      html += `<div class="qc-panel__grid">`;
      html += `<div>status：${escapeHtml(qc.status || 'unknown')}</div>`;
      html += `<div>completeness：${escapeHtml(completeness)}</div>`;
      html += `<div>sources：${escapeHtml(sources)}</div>`;
      html += `<div>fallback_source：${escapeHtml(fallback)}</div>`;
      html += `<div>missing：${escapeHtml(missing)}</div>`;
      html += `<div>stale_data：${stale.length ? escapeHtml(staleText || '存在') : '无'}</div>`;
      html += `<div>allowed_use：${escapeHtml(allowedUse)}</div>`;
      html += `<div>forbidden_use：${escapeHtml(forbiddenUse)}</div>`;
      html += `<div>blocked_fields：${escapeHtml(blockedFields)}</div>`;
      html += `</div>`;
      if (stale.length) {
        html += `<div class="qc-panel__warning">旧数据/试用账号延迟：${escapeHtml(staleText || '当前结果包含延迟或过期数据')}</div>`;
      }
      html += `</div>`;
      return html;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Pre-fill from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const preQuery = urlParams.get('q');
    if (preQuery) {
      queryInput.value = preQuery;
    }
  </script>
</body>
</html>
