{% extends "base.html" %}
{% block title %}注册 — Finance Suite{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card card">
        <h1 class="auth-title">注册</h1>
        <div class="auth-error" id="authError" style="display:none"></div>
        <form id="registerForm" onsubmit="register(event)">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input class="input" type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">邮箱</label>
                <input class="input" type="email" id="email" name="email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input class="input" type="password" id="password" name="password" placeholder="请输入密码（至少6位）" minlength="6" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password2">确认密码</label>
                <input class="input" type="password" id="password2" name="password2" placeholder="请再次输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="registerBtn">注册</button>
        </form>
        <p class="auth-switch">已有账号？<a href="/login">立即登录</a></p>
    </div>
</section>
{% endblock %}
